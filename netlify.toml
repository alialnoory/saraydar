# Netlify settings for saraydar.netlify.app

[build]
  publish = "."

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/abuquwa-villas/README.md"
  to = "/404.html"
  status = 404
  force = true

# The project data is only available through the API after sign-in
[[redirects]]
  from = "/abuquwa-villas/data/*"
  to = "/404.html"
  status = 404
  force = true

# The Abuquwa tracker has moved into the SarayDar Management System (Phase 3)
[[redirects]]
  from = "/abuquwa-villas/*"
  to = "https://saraydar-api.onrender.com/"
  status = 302
  force = true

[[redirects]]
  from = "/"
  to = "https://saraydar-api.onrender.com/"
  status = 302
  force = true
