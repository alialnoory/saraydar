# Netlify settings for saraydar.netlify.app

[build]
  publish = "."

# Keep exported project data (budget, prices, buyers) off the public site
[[redirects]]
  from = "/abuquwa-villas/data/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/abuquwa-villas/README.md"
  to = "/404.html"
  status = 404
  force = true

# Site root opens the Abuquwa Villas system
[[redirects]]
  from = "/"
  to = "/abuquwa-villas/"
  status = 302
